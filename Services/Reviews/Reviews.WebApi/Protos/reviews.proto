syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Reviews.Grpc";

package reviews;

service ReviewsService {
  rpc GetReview (GetReviewRequest) returns (ReviewReply);
  rpc GetForProducts (GetForProductsRequest) returns (ReviewsReply);
}

message GetReviewRequest {
  string id = 1;
}

message GetForProductsRequest {
  repeated int64 product_ids = 1;
  int32 per_product = 2;
}

message ReviewReply {
  string id = 1;
  int64 product_id = 2;
  string product_name = 3;
  optional string brand_name = 4;
  string author_name = 5;
  int32 rating = 6;
  optional string title = 7;
  optional string text = 8;
  bool verified_purchase = 9;
  int32 comments_count = 10;
  google.protobuf.Timestamp created_at = 11;
  int32 version = 12;
}

message ReviewsReply {
  repeated ReviewReply reviews = 1;
}